services:

  timescaledb:
    container_name: eiot-core-timescaledb
    image: "timescale/timescaledb:2.21.3-pg17"
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eiot_core_db
      PGDATA: /pgdata
    ports:
      - "5432:5432"
    volumes:
      - "./volumes/timescaledb:/pgdata"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5
    hostname: eiot-core-timescaledb
    networks:
      eiot:
        ipv4_address: 10.1.1.15

  mqtt-server:
    container_name: eiot-core-mqtt-server
    image: "eclipse-mosquitto:2.0.22"
    restart: unless-stopped
    environment:
      - PUID=3002
      - PGID=3002
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - "./volumes/mosquitto/config:/mosquitto/config:rw"
      - "./volumes/mosquitto/data:/mosquitto/data:rw"
      - "./volumes/mosquitto/log:/mosquitto/log:rw"
    hostname: eiot-mqtt-server
    networks:
      eiot:
        ipv4_address: 10.1.1.17

