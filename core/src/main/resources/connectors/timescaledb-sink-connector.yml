name: timescaledb-sink-connector
config:
  connector.class: io.confluent.connect.jdbc.JdbcSinkConnector
  tasks.max: 1
  topics: iot.telemetry,iot.command,iot.control
  connection.url: ${KAFKACONNECT_TIMESCALEDB_JDBC_CONNECTION_URL:jdbc:postgresql://10.1.11.15:5432/eiot_core_db}
  connection.user: postgres
  connection.password: postgres
  insert.mode: upsert
  auto.create: true
  auto.evolve: true
  pk.mode: record_key
  pk.fields: related_id, data_type, ts
  table.name.format: device_data
  delete.enabled: false
  value.converter: org.apache.kafka.connect.json.JsonConverter
  value.converter.schemas.enable: false